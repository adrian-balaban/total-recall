# Builds and publishes the plugin. This is the ONLY build pipeline — there is no
# local release gate.
#
# Distribution model (all three constraints held together):
#   * `plugins/total-recall/dist/` is gitignored on `main`, so no build artifact
#     is ever committed by hand.
#   * The plugin is distributed ONLY through the marketplace, which fetches a
#     git tree via `git-subdir` — so that tree must already contain `dist/`.
#   * Therefore CI builds `dist/` and force-publishes `main`'s tree plus the
#     built `dist/` onto the `release` branch, and `.claude-plugin/marketplace.json`
#     pins its source `ref` to `release`. Consumers get a GitHub-built bundle;
#     `main` stays artifact-free.
#
# Trigger model: `workflow_run` on the mutation gate, so a release is only ever
# published from a commit whose Stryker/audit/typecheck/build job went green. A
# plain `on: push` would race the gate and could publish a red commit.
#
# `workflow_dispatch` is the bootstrap/manual escape hatch: `workflow_run` only
# fires for workflow files that already exist on the default branch, so the
# commit that introduces this file cannot trigger itself. Run it once by hand
# (Actions → release → Run workflow) to publish the current version.
#
# The `release` branch is refreshed on every green run (consumers must be able to
# pick up fixes), while the tag + GitHub Release are cut only when the version in
# package.json changes — so doc-only commits produce no release noise.
name: release

on:
  workflow_run:
    workflows: [mutation]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # npm trusted publishing (provenance), no stored token

jobs:
  release:
    # On workflow_run, only publish from a green gate. On manual dispatch there
    # is no upstream run, so the condition passes through.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      # The commit the mutation gate validated — not the branch tip, which may
      # have advanced while the gate was running. Falls back to the dispatch SHA.
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Full history so --generate-notes can diff against the previous tag.
          fetch-depth: 0

      - name: Read plugin version
        id: v
        run: echo "version=$(jq -r .version plugins/total-recall/package.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: plugins/total-recall/package-lock.json

      # This build IS the distribution: dist/ exists nowhere in git until here.
      - name: Build plugin
        working-directory: plugins/total-recall
        run: |
          npm ci
          npm run build

      # Publish the validated tree + the freshly built dist/ to `release`, the
      # branch the marketplace installs from. Force-push because `release` is a
      # derived branch, not a development one — its history is disposable.
      - name: Publish built tree to the release branch
        # VERSION goes through env, never inline `${{ }}` in the script body: an
        # expression is substituted as shell SYNTAX before bash parses the line, so a
        # crafted value could run commands, while "$VERSION" is only ever a value.
        # The value is `jq -r .version package.json` (repo content, not user input),
        # so this is hardening against a future edit rather than a live hole — and it
        # resolves the CodeQL actions/code-injection alerts, which taint any
        # workflow_dispatch-reachable step output regardless of its origin.
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B release "$SHA"
          # Drop contributor-only files from the published tree (they stay on main).
          # Kept on purpose: src/, tsconfig.json and package-lock.json (install.sh
          # rebuilds dist/ after adding the vector deps), CLAUDE.md (GEMINI.md points
          # to it) and ARCHITECTURE.md (linked from the plugin README).
          #
          # .github/workflows/ is dropped for a second, harder reason: GITHUB_TOKEN may
          # not create or update workflow files without the `workflows` permission, so
          # force-pushing a tree that CONTAINS them is rejected outright —
          #   ! [remote rejected] release -> release (refusing to allow a GitHub App to
          #     create or update workflow `.github/workflows/<f>.yml` ...)
          # — which is how this job failed on af78408, after codeql.yml was added and
          # then removed on main. Stripping the directory is the least-privilege fix
          # (the alternative, granting `workflows: write`, widens the token for every
          # run); consumers install a plugin and have no use for our CI config.
          git rm -r -q --ignore-unmatch -- \
            .github/workflows \
            plugins/total-recall/src/__tests__ \
            plugins/total-recall/vitest.config.ts \
            plugins/total-recall/vitest.integration.config.ts \
            plugins/total-recall/vitest.stryker.config.ts \
            plugins/total-recall/stryker.conf.json \
            plugins/total-recall/scripts/loadtest.ts \
            plugins/total-recall/scripts/eval
          # -f overrides the .gitignore entry that keeps dist/ off main.
          git add -f plugins/total-recall/dist
          git commit -m "build: dist for v$VERSION ($SHA)"
          git push --force origin release

      - name: Skip the tag if this version was already released
        id: check
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION already tagged — release branch refreshed, nothing to tag."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Tag the source commit on main, not the derived release commit, so the
      # tag points at reviewable history. No artifact is attached: the plugin is
      # distributed only through the marketplace.
      - name: Create tag and release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$SHA" \
            --title "v$VERSION" \
            --generate-notes

      # The npm package is only the install bootstrap (bin/cli.mjs, no plugin code; the
      # prepublishOnly guard fails the publish if anything else would ship). It is published
      # when the version advances, from the same validated commit, with provenance.
      - name: Set up Node for npm publishing
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-node@v5
        with:
          # npm trusted publishing needs Node 22.14+ and npm 11.5.1+ (docs.npmjs.com/trusted-publishers).
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
      - name: Use an npm that supports trusted publishing
        if: steps.check.outputs.exists == 'false'
        run: npm install -g npm@^11.5.1
      - name: Publish the npx bootstrap to npm
        if: steps.check.outputs.exists == 'false'
        run: npm publish --access public --provenance
