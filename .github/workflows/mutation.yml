# The single build/release gate for this repo — there is no local pipeline.
#
# Runs on every push/PR to main: npm audit, typecheck, the full unit suite,
# the build, the integration suite against the real bundle, and mutation testing.
# Stryker re-runs the unit suite against all source modules and exits non-zero
# when the "of total" mutation score drops below `thresholds.break` (65) in
# stryker.conf.json. Server-boot, e2e, and integration tests are excluded from
# the Stryker runner (see vitest.stryker.config.ts) — they rely on import-order
# and HOME-isolation that Stryker's instrumented runner perturbs.
name: mutation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  stryker:
    name: Stryker mutation score ≥ 65% (all modules)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: plugins/total-recall
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: plugins/total-recall/package-lock.json
      # Install optional native deps too — Stryker runs the real vitest suite,
      # which exercises better-sqlite3 + sqlite-vec + @huggingface/transformers.
      - run: npm ci
      # Security gate: audit production dependencies to prevent critical supply-chain vulnerabilities
      - run: npm audit --audit-level=critical --omit=dev
      - run: npm run typecheck
      # dist/ is gitignored — CI is the only thing that builds it. Proving the
      # bundle builds is therefore part of the gate, not a local step. The build
      # also runs sync:version, so this catches a manifest that was hand-edited
      # out of sync with package.json.
      - run: npm run build
      - name: Verify manifests are version-synced with package.json
        run: git diff --exit-code -- .claude-plugin/plugin.json gemini-extension.json
      # The full unit suite — MUST run after the build. dist/ is gitignored, and
      # hooks/scripts/store-learning.mjs imports dist/frontmatter.mjs at runtime,
      # so hook-scripts.test.ts hits ERR_MODULE_NOT_FOUND on an unbuilt tree
      # (and install.sh, which now builds when dist/ is absent, would burn a
      # 90s `npm ci` inside its test and time out). Stryker's dry run only
      # executes the ~21-file allow-list in vitest.stryker.config.ts (293 of 744
      # tests), so without this step most of the suite runs nowhere.
      - run: npm test
      # Boots the real dist/index.js over stdio — the only check that the bundle
      # CI is about to publish to the `release` branch actually starts and
      # answers MCP calls. Kept as its own step so a failure here is
      # distinguishable from a unit-test failure at a glance.
      - run: npm run test:integration
      # Stryker runs the unit suite (all modules) under instrumentation (~5–8 min).
      # The `break: 65` threshold in stryker.conf.json makes stryker exit 1
      # when the "of total" score is below 65, failing this job.
      - run: npx stryker run